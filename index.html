<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>نظام دجلة للمحاسبة والمخازن</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root {
            --primary-color: #bfa15f;
            --dark-bg: #111111;
            --card-bg: #1a1a1a;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--dark-bg);
            color: var(--text-color);
            margin: 0;
            padding: 15px;
        }
        .header {
            text-align: center;
            padding: 20px;
            border-bottom: 2px solid var(--primary-color);
            margin-bottom: 20px;
        }
        .header img {
            width: 120px;
            height: 120px;
            border-radius: 15px;
            border: 2px solid var(--primary-color);
            object-fit: cover;
        }
        .header h1 {
            color: var(--primary-color);
            margin: 10px 0 5px 0;
            font-size: 24px;
        }
        .header p {
            color: var(--text-muted);
            margin: 0;
            font-size: 14px;
        }
        .nav-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn {
            background-color: var(--card-bg);
            color: var(--text-color);
            border: 1px solid var(--primary-color);
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-size: 14px;
        }
        .btn:active {
            background-color: var(--primary-color);
            color: var(--dark-bg);
        }
        .btn-success {
            background-color: var(--primary-color);
            color: var(--dark-bg);
            grid-column: span 2;
        }
        .section {
            background-color: var(--card-bg);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 20px;
            border: 1px solid #222;
        }
        .section-title {
            color: var(--primary-color);
            margin-top: 0;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            padding: 10px;
            text-align: right;
            border-bottom: 1px solid #222;
        }
        th {
            color: var(--primary-color);
            font-size: 14px;
        }
        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }
        input, select {
            flex: 1;
            background-color: #222;
            border: 1px solid #444;
            color: white;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
        }
        input:focus {
            border-color: var(--primary-color);
            outline: none;
        }
        .edit-input {
            width: 60px;
            padding: 5px;
            text-align: center;
            background-color: #333;
        }
        .badge {
            background-color: #2b2b2b;
            color: var(--primary-color);
            padding: 3px 8px;
            border-radius: 4px;
            font-size: 12px;
            border: 1px solid var(--primary-color);
        }
    </style>
</head>
<body>

    <div class="header">
        <img src="logo.png" alt="شعار معرض دجلة">
        <h1>معرض دجلة الذكي</h1>
        <p>نظام إدارة المخازن، القوائم وتعديل المبيعات الفوري</p>
    </div>

    <div class="nav-buttons">
        <button class="btn" onclick="showSection('catalog')">📦 إدارة الكتالوج</button>
        <button class="btn" onclick="showSection('sales-records')">📝 سجلات المبيعات</button>
        <button class="btn btn-success" onclick="showSection('pos')">🛒 قائمة البيع النشطة والتعديل الذكي</button>
    </div>

    <div id="pos" class="section">
        <div class="section-title">
            <span>🛒 قائمة البيع الحالية (أثناء وقبل البيع)</span>
            <span class="badge">تعديل ذكي مفعّل</span>
        </div>
        <div class="input-group">
            <input type="text" id="search-product" placeholder="ابحث عن منتج أو امسح الباركود...">
            <button class="btn" onclick="addProductToCart()">إضافة</button>
        </div>
        
        <table>
            <thead>
                <tr>
                    <th>المادة</th>
                    <th>الكمية</th>
                    <th>السعر</th>
                    <th>الإجمالي</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="cart-table-body">
                </tbody>
        </table>
        <div style="margin-top: 15px; text-align: left; font-size: 18px; font-weight: bold;">
            المجموع الكلي: <span id="cart-total" style="color: var(--primary-color);">0</span> دينار
        </div>
        <button class="btn btn-success" style="margin-top: 15px; width: 100%;" onclick="checkoutCart()">🔔 اعتماد وحفظ القائمة (حفظ بعد البيع)</button>
    </div>

    <div id="catalog" class="section" style="display:none;">
        <div class="section-title">📦 مستودع الكتالوج والمخازن</div>
        <div class="input-group">
            <input type="text" id="prod-name" placeholder="اسم المادة/المطبخ">
            <input type="number" id="prod-price" placeholder="السعر">
            <button class="btn" onclick="saveToCatalog()">حفظ بالمخزن</button>
        </div>
        <table id="catalog-table">
            <thead>
                <tr>
                    <th>المادة</th>
                    <th>السعر الأساسي</th>
                </tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <div id="sales-records" class="section" style="display:none;">
        <div class="section-title">📝 الفواتير المحفوظة (التعديل بعد البيع)</div>
        <div id="records-container">
            </div>
    </div>

    <script>
        // قواعد البيانات المحلية الافتراضية
        let catalog = JSON.parse(localStorage.getItem('dijla_catalog')) || [
            { id: 1, name: "مطبخ ألومنيوم دجلة ملكي", price: 1250000 },
            { id: 2, name: "باب خشب صاج فاخر", price: 250000 }
        ];
        
        let cart = JSON.parse(localStorage.getItem('dijla_cart')) || [];
        let salesHistory = JSON.parse(localStorage.getItem('dijla_sales')) || [];

        function showSection(sectionId) {
            document.getElementById('pos').style.display = sectionId === 'pos' ? 'block' : 'none';
            document.getElementById('catalog').style.display = sectionId === 'catalog' ? 'block' : 'none';
            document.getElementById('sales-records').style.display = sectionId === 'sales-records' ? 'block' : 'none';
            renderAll();
        }

        // تحديث جدول السلة مع تفعيل ميزة التعديل أثناء البيع
        function renderCart() {
            const tbody = document.getElementById('cart-table-body');
            tbody.innerHTML = '';
            let total = 0;

            cart.forEach((item, index) => {
                let itemTotal = item.price * item.quantity;
                total += itemTotal;

                tbody.innerHTML += `
                    <tr>
                        <td>${item.name}</td>
                        <td><input type="number" class="edit-input" value="${item.quantity}" onchange="updateCartItem(${index}, 'quantity', this.value)"></td>
                        <td><input type="number" class="edit-input" style="width:90px;" value="${item.price}" onchange="updateCartItem(${index}, 'price', this.value)"></td>
                        <td>${itemTotal.toLocaleString()}</td>
                        <td><button class="btn" style="padding:4px 8px; border-color:#ff4444; color:#ff4444;" onclick="removeFromCart(${index})">حذف</button></td>
                    </tr>
                `;
            });

            document.getElementById('cart-total').innerText = total.toLocaleString();
            localStorage.setItem('dijla_cart', JSON.stringify(cart));
        }

        // ميزة التعديل الذكي قبل وأثناء البيع للقيم
        function updateCartItem(index, field, value) {
            cart[index][field] = parseFloat(value) || 0;
            renderCart();
        }

        function addProductToCart() {
            // إضافة مادة افتراضية للتجربة أو البحث
            cart.push({ id: Date.now(), name: "تخصيص مادة جديدة", quantity: 1, price: 100000 });
            renderCart();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            renderCart();
        }

        // الحفظ والاعتماد بعد البيع
        function checkoutCart() {
            if(cart.length === 0) return alert("القائمة فارغة حالياً!");
            let invoice = {
                id: 'INV-' + Date.now(),
                date: new Date().toLocaleString('ar-IQ'),
                items: [...cart],
                total: cart.reduce((sum, item) => sum + (item.price * item.quantity), 0)
            };
            salesHistory.push(invoice);
            localStorage.setItem('dijla_sales', JSON.stringify(salesHistory));
            cart = [];
            localStorage.removeItem('dijla_cart');
            alert("تم حفظ القائمة واعتماد البيع بنجاح!");
            showSection('sales-records');
        }

        // ميزة التعديل الفوري بعد البيع (إرجاع الفاتورة للحالة النشطة للتعديل عليها)
        function editInvoiceAfterSale(invoiceId) {
            let invIndex = salesHistory.findIndex(i => i.id === invoiceId);
            if(invIndex > -1) {
                cart = [...salesHistory[invIndex].items];
                salesHistory.splice(invIndex, 1); // سحبها للتعديل
                localStorage.setItem('dijla_sales', JSON.stringify(salesHistory));
                alert("تم إرجاع الفاتورة إلى قائمة البيع النشطة، يمكنك التعديل عليها الآن وإعادة حفظها!");
                showSection('pos');
            }
        }

        function renderSalesHistory() {
            const container = document.getElementById('records-container');
            container.innerHTML = '';
            if(salesHistory.length === 0) container.innerHTML = '<p style="color:gray; text-align:center;">لا توجد قوائم مبيعات محفوظة حالياً.</p>';
            
            salesHistory.forEach(inv => {
                container.innerHTML += `
                    <div style="background:#222; padding:12px; border-radius:8px; margin-bottom:10px; border-left:3px solid var(--primary-color);">
                        <div style="display:flex; justify-content:space-between; margin-bottom:8px;">
                            <span style="font-weight:bold; color:var(--primary-color);">${inv.id}</span>
                            <span style="font-size:12px; color:gray;">${inv.date}</span>
                        </div>
                        <div style="font-size:13px; color:#ccc; margin-bottom:8px;">عدد المواد: ${inv.items.length} | المجموع: ${inv.total.toLocaleString()} د.ع</div>
                        <button class="btn" style="width:100%; padding:6px; font-size:12px;" onclick="editInvoiceAfterSale('${inv.id}')">🔄 تعديل هذه القائمة (إعادة فتح بعد البيع)</button>
                    </div>
                `;
            });
        }

        function renderCatalog() {
            const tbody = document.querySelector('#catalog-table tbody');
            tbody.innerHTML = '';
            catalog.forEach(p => {
                tbody.innerHTML += `<tr><td>${p.name}</td><td>${p.price.toLocaleString()} د.ع</td></tr>`;
            });
        }

        function saveToCatalog() {
            let name = document.getElementById('prod-name').value;
            let price = parseFloat(document.getElementById('prod-price').value);
            if(name && price) {
                catalog.push({id: Date.now(), name, price});
                localStorage.setItem('dijla_catalog', JSON.stringify(catalog));
                document.getElementById('prod-name').value = '';
                document.getElementById('prod-price').value = '';
                renderCatalog();
            }
        }

        function renderAll() {
            renderCart();
            renderCatalog();
            renderSalesHistory();
        }

        // تشغيل نظام الخدمة والـ PWA بدون نت
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
        
        window.onload = renderAll;
    </script>
</body>
</html>
